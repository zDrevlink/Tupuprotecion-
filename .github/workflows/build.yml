name: Build TuPuProtection

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar con Maven (busca el pom.xml en la raíz del repo)
        run: mvn -B clean package --file pom.xml

      - name: Subir el jar como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: TuPuProtection-jar
          path: target/*.jar
