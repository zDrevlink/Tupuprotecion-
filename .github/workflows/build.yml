name: Compilar Plugin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Buscar pom.xml y Compilar con Maven
      run: |
        POM_PATH=$(find . -name "pom.xml" -not -path "*/target/*" | head -n 1)
        if [ -z "$POM_PATH" ]; then
          echo "Error: No se encontró ningún archivo pom.xml en el repositorio."
          exit 1
        fi
        echo "Archivo pom.xml encontrado en: $POM_PATH"
        mvn clean package --batch-mode -f "$POM_PATH"

    - name: Guardar JAR generado
      uses: actions/upload-artifact@v4
      with:
        name: Plugin-Compilado
        path: '**/target/*.jar'
