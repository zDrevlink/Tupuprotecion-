name: Build TuPuProtection

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Buscar el pom.xml en el repositorio
        id: find_pom
        run: |
          POM_PATH=$(find . -type f -name "pom.xml" -not -path "*/target/*" | head -n 1)
          if [ -z "$POM_PATH" ]; then
            echo "No se encontró ningún pom.xml en el repositorio." >&2
            exit 1
          fi
          echo "Encontrado: $POM_PATH"
          echo "pom_path=$POM_PATH" >> "$GITHUB_OUTPUT"
          echo "project_dir=$(dirname "$POM_PATH")" >> "$GITHUB_OUTPUT"

      - name: Compilar con Maven
        run: mvn -B clean package --file "${{ steps.find_pom.outputs.pom_path }}"

      - name: Subir el jar como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: TuPuProtection-jar
          path: ${{ steps.find_pom.outputs.project_dir }}/target/*.jar
